# Sensor poses from the vehicle CAD (RANGER_Assy_v1.0.step, 2026-10-28), relative to sensor_kit_base_link
# (= base_link + z 0.345, chassis top). CAD +Y = vehicle front, +Z = up, CAD origin = base_link within 1 mm,
# so ROS x = Y_cad, y = -X_cad, z = Z_cad - 345 mm.
sensor_kit_base_link:
  rs_airy_top_base_link:  # Airy base center (lidar origin per RoboSense guide), CAD (0, 300, 696) mm, connector to the rear -> yaw 0
    x: 0.301
    y: 0.000
    z: 0.351
    roll: 0.000000
    pitch: 0.000000
    yaw: 0.000000
  d435i/camera_link:
    x: 0.340
    y: 0.000000
    z: 0.0125
    roll: 0.000000
    pitch: 0.000000
    yaw: 0.000000
  rs_airy/imu_link:  # airy_converter rotates the IMU into the lidar axes, so same pose as the lidar (chip offset ~4 mm ignored)
    x: 0.301
    y: 0.000
    z: 0.351
    roll: 0.000000
    pitch: 0.000000
    yaw: 0.000000
  gnss_link:  # C-RTK 9P antenna (CSX627A) over the rear axle, CAD center (-2.8, -283) mm, body z 622~668 mm;
              # phase center z 0.655 m estimated (+-2 cm), refine with the antenna datasheet
    x: -0.282
    y: 0.003
    z: 0.310
    roll: 0.000000
    pitch: 0.000000
    yaw: 0.000000
