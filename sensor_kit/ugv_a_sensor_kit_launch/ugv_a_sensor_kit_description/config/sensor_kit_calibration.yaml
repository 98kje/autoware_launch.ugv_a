# Sensor poses on the temporary aluminium frame (field measured 2026-11-06, photo IMG_0997),
# relative to sensor_kit_base_link = deck top center (base_link + z 0.330).
# x = front, y = left, z = up. The CAD frame (RANGER_Assy_v1.0.step) is not used until it is delivered.
sensor_kit_base_link:
  rs_airy_top_base_link:  # Airy base center (lidar origin per RoboSense guide), measured (27, 0, 81.5) cm, connector to the rear -> yaw 0
    x: 0.270
    y: 0.000
    z: 0.815
    roll: 0.000000
    pitch: 0.000000
    yaw: 0.000000
  d435i/camera_link:
    x: 0.340
    y: 0.000000
    z: 0.0125
    roll: 0.000000
    pitch: 0.000000
    yaw: 0.000000
  rs_airy/imu_link:  # airy_converter rotates the IMU into the lidar axes, so same pose as the lidar (chip offset ~4 mm ignored)
    x: 0.270
    y: 0.000
    z: 0.815
    roll: 0.000000
    pitch: 0.000000
    yaw: 0.000000
  gnss_link:  # C-RTK 9P on the deck behind the center, base measured (-33.5, 0, 0) cm;
              # z = antenna phase center ~33 mm above its base (CAD estimate, +-2 cm, no datasheet value)
    x: -0.335
    y: 0.000
    z: 0.033
    roll: 0.000000
    pitch: 0.000000
    yaw: 0.000000
